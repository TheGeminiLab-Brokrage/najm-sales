<body class="is-my">

<!-- A SALES AGENT'S "MY ACTIVITY" (build 13): Main Marks' my.html for Najm, drawn by js/activity.js
     on the book of js/activity-book.js. The bar on every page leads here: My activity, Profile
     (#profile), and the plus (#record).

     THE PULSE (Main Marks build 132): the heartbeat on the bar opens this, a half-dial sweeping in
     with a heartbeat drawn through it, alone on the screen; then My activity comes up. IT IS IN THE
     PAGE ITSELF, with its first frame decided inline, so the wait for the figures is the pulse and
     never an empty screen. Profile and the plus open at once. -->
<div class="pulse-in" id="pulseIn" aria-hidden="true">
  <div class="pi-wrap">
    <div class="pi-halo"></div>
    <svg class="pi-dial" viewBox="0 0 240 128">
      <path class="g-track" d="M 20 116 A 100 100 0 0 1 220 116"/>
      <path class="g-arc g-a" style="--k:0" d="M 20 116 A 100 100 0 0 1 220 116" stroke-dasharray="124.8 629" stroke-dashoffset="0"/>
      <path class="g-arc g-q" style="--k:1" d="M 20 116 A 100 100 0 0 1 220 116" stroke-dasharray="21.1 629" stroke-dashoffset="-128.8"/>
      <path class="g-arc g-i" style="--k:2" d="M 20 116 A 100 100 0 0 1 220 116" stroke-dasharray="77.7 629" stroke-dashoffset="-153.9"/>
      <path class="g-beat" pathLength="100" d="M 62 100 h 34 l 9 -26 l 13 44 l 11 -32 l 7 14 h 42"/>
    </svg>
    <p class="pi-label" id="piLabel">My activity</p>
  </div>
</div>
<script>
(function () { if (/^#(profile|record)$/.test(location.hash)) document.getElementById('pulseIn').hidden = true; }());
</script>

<div id="top"></div>
<main class="scr" id="scr"></main>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div>
<div class="toast" role="status"></div>

<script src="js/config.js?v=28"></script>

<script data-later="js/activity.js?v=28"></script>
</body>
